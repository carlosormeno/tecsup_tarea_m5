apiVersion: 1

datasources:
  # Métricas
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  # Trazas
  - name: Zipkin
    type: zipkin
    uid: zipkin
    access: proxy
    url: http://zipkin:9411
    editable: true

  # Logs
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      # Convierte el identificador de traza que aparezca en cada log en un
      # enlace directo a Zipkin: métrica rara -> traza lenta -> logs de esa
      # petición exacta.
      #
      # PENDIENTE DE VERIFICAR: hay que comprobar con los servicios corriendo
      # que el formato ECS incluya el traceId en el archivo de log. La consola
      # sí lo muestra (viene del MDC, patrón `[app,traceId,spanId]`), pero está
      # sin confirmar que el escritor de ECS lo vuelque al fichero. Si no lo
      # hiciera, esta expresión no encontrará nada y habría que añadirlo
      # explícitamente a la configuración de logging.
      derivedFields:
        - name: TraceID
          matcherRegex: '"traceId":"(\w+)"'
          url: '$${__value.raw}'
          datasourceUid: zipkin
