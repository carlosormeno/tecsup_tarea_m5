global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # --------------------------------------------------------------------------
  # Microservicios.
  #
  # Hoy apuntan al host porque los servicios se levantan desde el IDE.
  # Cuando entren al compose como contenedores, hay que cambiar cada target
  # por el nombre del servicio: 'user-service:8081', 'catalog-service:8082', etc.
  # --------------------------------------------------------------------------
  - job_name: microservicios
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels: {servicio: usuarios}
      - targets: ['host.docker.internal:8082']
        labels: {servicio: catalogo}
      - targets: ['host.docker.internal:8083']
        labels: {servicio: pedidos}
      - targets: ['host.docker.internal:8084']
        labels: {servicio: pagos}
      - targets: ['host.docker.internal:8085']
        labels: {servicio: entregas}
