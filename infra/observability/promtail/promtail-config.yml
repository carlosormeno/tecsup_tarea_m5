server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ---------------------------------------------------------------------------
  # Lee los .log que escriben los microservicios en la carpeta ./logs del
  # proyecto. Funciona igual si el servicio corre desde el IDE o dentro de un
  # contenedor: en ambos casos escribe en la misma carpeta montada.
  # ---------------------------------------------------------------------------
  - job_name: microservicios
    static_configs:
      - targets:
          - localhost
        labels:
          job: microservicios
          __path__: /logs/*.log

    pipeline_stages:
      # El formato ECS de Spring Boot ANIDA los campos:
      #
      #   {"@timestamp":"...",
      #    "log":     {"level":"INFO","logger":"com.tecsup..."},
      #    "service": {"name":"order-service"},
      #    "message": "..."}
      #
      # Por eso las rutas van sin comillas: en JMESPath, `log.level` navega
      # hasta el objeto anidado, mientras que `"log.level"` buscaría una clave
      # llamada literalmente así, que no existe. Con las comillas no se extrae
      # nada y las etiquetas salen vacías.
      - json:
          expressions:
            nivel: log.level
            logger: log.logger
            servicio: service.name
            mensaje: message

      # Solo servicio y nivel como etiquetas: son pocos valores distintos.
      # Nunca el traceId ni el logger completo — cada valor nuevo crea un
      # stream en Loki, y con identificadores únicos por petición eso degrada
      # el índice hasta hacerlo inservible.
      - labels:
          servicio:
          nivel:

      - timestamp:
          source: '@timestamp'
          format: RFC3339Nano
