# =============================================================================
# Configuración común y secretos.
#
# Lo que cambia entre entornos va aquí y no dentro de la imagen: la misma
# imagen sirve para desarrollo y para el clúster, y solo cambian las variables
# de entorno. Es el tercer factor de los doce.
#
# Dentro del clúster los servicios se encuentran por DNS: `kafka` resuelve a
# kafka.pedidos.svc.cluster.local. Por eso no hay ni una dirección IP escrita.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-comun
  namespace: pedidos
data:
  KAFKA_SERVERS: "kafka:9092"
  ZIPKIN_URL: "http://zipkin:9411/api/v2/spans"
  LOG_LEVEL: "INFO"
  # Menos que en el host: cinco JVM tienen que caber en el mismo nodo
  JAVA_OPTS: "-Xmx320m -Xms128m -XX:MaxRAMPercentage=75"
  POOL_SIZE: "5"

---
# =============================================================================
# Secretos.
#
# LIMITACIÓN DECLARADA: esto es un Secret de Kubernetes, que solo está
# codificado en base64, no cifrado. Cualquiera con permiso de lectura sobre el
# namespace puede leerlo. En producción iría con cifrado en reposo en etcd y un
# gestor externo (Vault, Sealed Secrets o el del proveedor de nube).
#
# Se deja así, y se dice, porque las credenciales son de desarrollo y las mismas
# que ya están en los application.yaml del repositorio.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: secretos
  namespace: pedidos
type: Opaque
stringData:
  # La clave simétrica compartida por los cinco servicios (ver ADR-011)
  JWT_SECRET: "m1S3cr3tK3yJWT_T3csup2025!@#SecureToken"

  POSTGRES_PASSWORD: "postgres"

  USER_DB_PASSWORD: "user_pass"
  CATALOG_DB_PASSWORD: "catalog_pass"
  ORDER_DB_PASSWORD: "order_pass"
  PAYMENT_DB_PASSWORD: "payment_pass"
  DELIVERY_DB_PASSWORD: "delivery_pass"
