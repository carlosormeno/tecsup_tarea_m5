# =============================================================================
# Zookeeper.
#
# Kafka 7.5 con Zookeeper y no con KRaft, por coherencia con el compose y con
# lo visto en el curso. En un despliegue nuevo hoy se elegiría KRaft, que
# elimina esta pieza.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: pedidos
spec:
  selector:
    app: zookeeper
  ports:
    - port: 2181
      targetPort: 2181

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: pedidos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.5.0
          ports:
            - containerPort: 2181
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx256m -Xms128m"
          readinessProbe:
            tcpSocket:
              port: 2181
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "192Mi"
              cpu: "50m"
            limits:
              memory: "384Mi"
              cpu: "500m"
