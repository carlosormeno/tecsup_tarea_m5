# =============================================================================
# Kafka.
#
# Dos listeners, por la misma razón que en el compose:
#   kafka:9092        -> desde los pods del clúster
#   localhost:30092   -> desde el host, para kafka-consumer-groups y kafka-ui
#
# Un solo broker y replicación 1: no se puede demostrar tolerancia a fallos de
# broker con esto, y así se declara. En producción serían 3 y factor 3, sin
# tocar una línea de código de los servicios.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: pedidos
spec:
  # Sin esto, Kafka no arranca nunca. Es un bloqueo circular:
  #
  #   el broker se anuncia como `kafka:9092` y su propio controlador se conecta
  #   ahí -> el Service solo enruta a pods READY -> el pod no está READY hasta
  #   que el broker arranque -> el broker no arranca porque no se alcanza.
  #
  # publishNotReadyAddresses hace que el Service resuelva al pod desde que
  # existe, aunque todavía no esté listo, y el arranque puede completarse.
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: interno
      port: 9092
      targetPort: 9092

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-externo
  namespace: pedidos
spec:
  type: NodePort
  selector:
    app: kafka
  ports:
    - name: externo
      port: 30092
      targetPort: 30092
      nodePort: 30092

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: pedidos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      # IMPRESCINDIBLE, y cuesta un rato descubrirlo.
      #
      # Kubernetes inyecta en cada pod variables heredadas de los enlaces de
      # Docker por cada Service del namespace: como el Service se llama `kafka`,
      # el pod recibe KAFKA_PORT=tcp://10.96.x.x:9092 entre otras.
      #
      # La imagen de Confluent convierte TODA variable KAFKA_* en una propiedad
      # del broker, así que arranca con `port=tcp://10.96.x.x:9092`, avisa de
      # que `port` está obsoleto y muere. El síntoma es un CrashLoopBackOff con
      # un log de cuatro líneas que no menciona la causa.
      #
      # Con esto, Kubernetes no inyecta esas variables y solo llegan las que
      # están declaradas abajo.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          ports:
            - containerPort: 9092
            - containerPort: 30092
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper:2181"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "INTERNO:PLAINTEXT,EXTERNO:PLAINTEXT"
            - name: KAFKA_LISTENERS
              value: "INTERNO://0.0.0.0:9092,EXTERNO://0.0.0.0:30092"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "INTERNO://kafka:9092,EXTERNO://localhost:30092"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "INTERNO"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"

            # Desactivada a propósito: con creación automática, un consumidor
            # que arranque antes que su productor haría que Kafka creara el
            # topic con UNA partición, y un topic existente ya no cambia de
            # particiones. El sistema quedaría degradado según el orden de
            # arranque. Los topics los crean los beans NewTopic de cada
            # servicio, siempre con 3.
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_NUM_PARTITIONS
              value: "3"

            - name: KAFKA_HEAP_OPTS
              value: "-Xmx512m -Xms256m"
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "kafka-topics --bootstrap-server localhost:9092 --list"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 10
          resources:
            requests:
              memory: "640Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
