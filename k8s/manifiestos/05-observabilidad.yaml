# =============================================================================
# Observabilidad: Prometheus, Grafana, Zipkin, Loki y Promtail.
#
# Las mismas cuatro herramientas que en el compose, pero con una diferencia que
# es una mejora, no una traducción: PROMTAIL LEE LA SALIDA ESTÁNDAR DE LOS PODS.
#
# En compose, cada servicio escribe un archivo en ./logs y Promtail monta esa
# carpeta. Aquí no hace falta: Promtail va como DaemonSet, lee /var/log/pods del
# nodo y consulta la API de Kubernetes para etiquetar cada línea con namespace,
# pod, contenedor y app. Los servicios no tienen que escribir archivos ni
# compartir volumen con nadie, que es como debe ser en un contenedor.
#
# ACCESO DESDE EL HOST. Los Services son ClusterIP y se llega por el Ingress,
# bajo el MISMO origen que el front y las APIs:
#
#   http://localhost:8000/grafana      admin / admin
#   http://localhost:8000/zipkin
#   http://localhost:8000/prometheus
#
# Cada herramienta necesita saber que vive bajo un prefijo, o genera enlaces
# absolutos a / y su interfaz se rompe al navegar aunque la primera página
# cargue. De ahí GF_SERVER_SERVE_FROM_SUB_PATH, ZIPKIN_UI_BASEPATH y
# --web.external-url. Loki no lleva prefijo porque no tiene interfaz propia: se
# consulta desde Grafana.
#
# La alternativa, si algo fallara, sigue disponible sin cambiar nada:
#   kubectl port-forward -n pedidos svc/grafana 3000:3000
# =============================================================================

# -----------------------------------------------------------------------------
# PROMETHEUS
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: pedidos
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      # Objetivos estáticos por nombre de Service: Kubernetes los resuelve por
      # DNS. Con descubrimiento automático (kubernetes_sd_configs) haría falta
      # RBAC y anotaciones en cada Deployment; con cinco servicios conocidos, la
      # lista explícita se lee mejor y no puede fallar por una anotación mal
      # puesta.
      - job_name: microservicios
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - user-service:8081
              - catalog-service:8082
              - order-service:8083
              - payment-service:8084
              - delivery-service:8085

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: pedidos
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: pedidos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=6h
            # Con external-url, Prometheus sirve bajo /prometheus y genera bien
            # sus propios enlaces internos
            - --web.external-url=http://localhost:8000/prometheus
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "384Mi"
              cpu: "500m"
      volumes:
        - name: config
          configMap:
            name: prometheus-config

---
# -----------------------------------------------------------------------------
# ZIPKIN
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: zipkin
  namespace: pedidos
spec:
  selector:
    app: zipkin
  ports:
    - port: 9411
      targetPort: 9411

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: pedidos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zipkin
  template:
    metadata:
      labels:
        app: zipkin
    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin:3.4
          ports:
            - containerPort: 9411
          env:
            # En memoria: las trazas se pierden al reiniciar. Suficiente para
            # una demostración y evita añadir Elasticsearch al despliegue.
            - name: STORAGE_TYPE
              value: mem
            - name: JAVA_OPTS
              value: "-Xmx256m"
            # La interfaz cuelga de /zipkin; la API de ingesta sigue en /api/v2
            - name: ZIPKIN_UI_BASEPATH
              value: "/zipkin"
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
# -----------------------------------------------------------------------------
# LOKI
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: pedidos
spec:
  selector:
    app: loki
  ports:
    - port: 3100
      targetPort: 3100

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: pedidos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:2.9.8
          # La imagen trae una configuración de nodo único lista para usar; no
          # hace falta un ConfigMap propio para un despliegue de demostración.
          args:
            - -config.file=/etc/loki/local-config.yaml
          ports:
            - containerPort: 3100
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "384Mi"
              cpu: "500m"

---
# -----------------------------------------------------------------------------
# PROMTAIL
#
# DaemonSet: uno por nodo, porque lee del sistema de archivos del nodo.
# Necesita RBAC para preguntar a la API qué pod es cada archivo de log.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: pedidos

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "watch", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: pedidos

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: pedidos
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080

    clients:
      - url: http://loki:3100/loki/api/v1/push

    positions:
      filename: /tmp/positions.yaml

    scrape_configs:
      - job_name: pods
        kubernetes_sd_configs:
          - role: pod

        pipeline_stages:
          # Los servicios escriben JSON en formato ECS. Extraer traceId aquí
          # permite buscar por traza en Grafana sin filtrar por texto.
          - cri: {}
          - json:
              expressions:
                nivel: log.level
                traceId: traceId
              drop_malformed: true
          - labels:
              nivel:

        relabel_configs:
          # Solo los pods de nuestro namespace: el resto es ruido del sistema
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: pedidos
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: servicio
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - target_label: job
            replacement: microservicios
          # Esta es la que de verdad importa: construye la ruta del archivo de
          # log dentro del nodo a partir de los metadatos del pod.
          - source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            target_label: __path__
            separator: /
            replacement: /var/log/pods/*$1/*.log

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: pedidos
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:2.9.8
          args:
            - -config.file=/etc/promtail/promtail.yaml
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
            - name: contenedores
              mountPath: /var/lib/docker/containers
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "192Mi"
              cpu: "300m"
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: pods
          hostPath:
            path: /var/log/pods
        - name: contenedores
          hostPath:
            path: /var/lib/docker/containers

---
# -----------------------------------------------------------------------------
# GRAFANA
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: pedidos
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true

      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        jsonData:
          # Convierte el traceId de cada línea de log en un enlace a Zipkin:
          # el salto de log a traza, que es la mitad útil de tener las dos.
          derivedFields:
            - name: TraceID
              matcherRegex: '"traceId":"(\w+)"'
              url: '$${__value.raw}'
              datasourceUid: zipkin

      - name: Zipkin
        type: zipkin
        uid: zipkin
        access: proxy
        url: http://zipkin:9411

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: pedidos
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: pedidos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            # Para vivir bajo /grafana en el Ingress. Sin SERVE_FROM_SUB_PATH,
            # Grafana genera enlaces absolutos a / y la interfaz se rompe al
            # navegar, aunque la primera página cargue.
            - name: GF_SERVER_ROOT_URL
              value: "http://localhost:8000/grafana"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "384Mi"
              cpu: "500m"
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
