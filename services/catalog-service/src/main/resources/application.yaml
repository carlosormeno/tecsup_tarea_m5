# =============================================================================
# Servicio de Catálogo
# =============================================================================
server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: catalog-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catalogdb}
    username: ${DB_USERNAME:catalog_svc}
    password: ${DB_PASSWORD:catalog_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # V1 crea el esquema y V2 carga restaurantes y productos de ejemplo. Sin esos
  # datos no se puede crear ningún pedido, así que la semilla va aquí y no en
  # un script suelto.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}

    # Este servicio no publica eventos de NEGOCIO, pero necesita un productor
    # igualmente: DeadLetterPublishingRecoverer usa un KafkaTemplate para
    # enviar a la DLT los mensajes que agotan sus reintentos.
    #
    # Sin esto Spring usa StringSerializer por defecto, que no puede
    # serializar el objeto del evento, la publicación a la DLT falla, el
    # offset no se confirma y el consumidor entra en bucle. "No publica
    # eventos" no significa "no necesita productor".
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all

    consumer:
      group-id: catalogo-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer envuelve al de JSON: sin él, un mensaje con
      # JSON inválido falla ANTES del listener, el offset no avanza y la
      # partición queda bloqueada para siempre (poison pill).
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.tecsup.app.micro.catalog.*
        # Nombres lógicos que publica order-service -> DTO propio de este servicio
        spring.json.type.mapping: >
          pedidoConfirmado:com.tecsup.app.micro.catalog.infrastructure.messaging.dto.PedidoConfirmadoDTO,
          pedidoCancelado:com.tecsup.app.micro.catalog.infrastructure.messaging.dto.PedidoCanceladoDTO

    listener:
      observation-enabled: true

# =============================================================================
# Seguridad: misma clave simétrica que el resto de servicios
# =============================================================================
jwt:
  secret: ${JWT_SECRET:m1S3cr3tK3yJWT_T3csup2025!@#SecureToken}

seguridad:
  rutas-publicas: /actuator/**, /swagger-ui.html, /swagger-ui/**, /v3/api-docs/**

# =============================================================================
# Observabilidad
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

logging:
  structured:
    format:
      file: ecs
  file:
    name: ${LOG_FILE:../../logs/catalog-service.log}
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
  level:
    com.tecsup.app.micro.catalog: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}

# Swagger UI en http://localhost:8082/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
